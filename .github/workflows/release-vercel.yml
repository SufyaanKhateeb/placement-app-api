name: Release to Vercel

on:
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: Full commit SHA from the UI main branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  check-api:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: check-api
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SufyaanKhateeb/placement-app-ui
          ref: main
          path: web
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UI_CHECKOUT_TOKEN || github.token }}
      - name: Select the reviewed frontend commit
        env:
          FRONTEND_COMMIT: ${{ inputs.frontend_commit }}
        run: |
          if [[ ! "$FRONTEND_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide the full lowercase SHA of a commit on the UI main branch." >&2
            exit 1
          fi
          git -C web merge-base --is-ancestor "$FRONTEND_COMMIT" HEAD
          git -C web checkout --detach "$FRONTEND_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify required release settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN MIGRATION_DATABASE_URL PRODUCTION_ORIGIN; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to release." >&2
              exit 1
            fi
          done
          [[ "$PRODUCTION_ORIGIN" == https://* ]]
      - run: npm install --global vercel@66.6.0
      - name: Build both repositories on Vercel
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          release_dir=$(mktemp -d "${RUNNER_TEMP}/placement-release.XXXXXX")
          mkdir "$release_dir/web"
          git archive HEAD | tar -x -C "$release_dir"
          git -C web archive HEAD | tar -x -C "$release_dir/web"
          test -f "$release_dir/web/package-lock.json"
          cd "$release_dir"
          deployment_output=$(vercel deploy --prod --skip-domain --yes --logs \
            --build-env VITE_BACKEND_URL=/api/v1 --token="$VERCEL_TOKEN")
          deployment_url=$(printf '%s' "$deployment_output" | jq -Rrs '
            sub("^\s+"; "") | sub("\s+$"; "")
            | if startswith("{") then fromjson | .deployment.url else . end')
          if [[ ! "$deployment_url" =~ ^https://([a-zA-Z0-9-]+\.vercel\.app)/?$ ]]; then
            echo "Vercel did not return a usable deployment URL." >&2
            exit 1
          fi
          deployment_host=${BASH_REMATCH[1]}
          deployment_id=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" |
            jq -er --arg project "$VERCEL_PROJECT_ID" '
              select(.projectId == $project and .target == "production" and .readyState == "READY")
              | .id | select(type == "string" and test("^dpl_[A-Za-z0-9]+$"))')
          printf 'id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: go run ./cmd/migrate up
      - name: Promote the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"
      - name: Verify frontend and Go API
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "${PRODUCTION_ORIGIN%/}/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "${PRODUCTION_ORIGIN%/}/api/v1/auth/providers" |
            jq -e '.google | type == "boolean"'
