name: Release to Vercel

on:
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: Full commit SHA from the UI main branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  check-api:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: check-api
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SufyaanKhateeb/placement-app-ui
          ref: main
          path: web
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.UI_CHECKOUT_TOKEN || github.token }}
      - name: Select the reviewed frontend commit
        env:
          FRONTEND_COMMIT: ${{ inputs.frontend_commit }}
        run: |
          if [[ ! "$FRONTEND_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provide the full lowercase SHA of a commit on the UI main branch." >&2
            exit 1
          fi
          git -C web merge-base --is-ancestor "$FRONTEND_COMMIT" HEAD
          git -C web checkout --detach "$FRONTEND_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify required release settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN MIGRATION_DATABASE_URL PRODUCTION_ORIGIN; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to release." >&2
              exit 1
            fi
          done
          [[ "$PRODUCTION_ORIGIN" == https://* ]]
      - run: npm install --global vercel@66.6.0
      - name: Build and stage on Vercel
        id: build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          release_dir=$(mktemp -d "${RUNNER_TEMP}/placement-release.XXXXXX")
          mkdir "$release_dir/web"
          git archive HEAD | tar -x -C "$release_dir"
          git -C web archive HEAD | tar -x -C "$release_dir/web"
          test -f "$release_dir/web/package-lock.json"
          cd "$release_dir"
          vercel deploy --prod --skip-domain --yes --logs \
            --build-env VITE_BACKEND_URL=/api/v1 --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/vercel-deployment-output"
      - name: Confirm the staged deployment is ready
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(jq -Rrs '
            sub("^[[:space:]]+"; "") | sub("[[:space:]]+$"; "")
            | if startswith("{") then fromjson | .deployment.url else . end
          ' "$RUNNER_TEMP/vercel-deployment-output")
          if [[ ! "$deployment_url" =~ ^https://([a-zA-Z0-9-]+\.vercel\.app)/?$ ]]; then
            echo "Vercel did not return a usable deployment URL." >&2
            exit 1
          fi
          DEPLOYMENT_HOST=${BASH_REMATCH[1]}
          printf 'host=%s\n' "$DEPLOYMENT_HOST" >> "$GITHUB_OUTPUT"
          printf 'Vercel staged deployment: %s\n' "$deployment_url"
          deployment_id=$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$VERCEL_ORG_ID" |
            jq -er --arg project "$VERCEL_PROJECT_ID" '
              select(.projectId == $project and .target == "production" and .readyState == "READY")
              | .id | select(type == "string" and test("^dpl_[A-Za-z0-9]+$"))')
          printf 'id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        id: migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: go run ./cmd/migrate up
      - name: Promote the deployment
        id: promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID"
      - name: Verify the public site and signed-out API
        id: smoke
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "${PRODUCTION_ORIGIN%/}/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "${PRODUCTION_ORIGIN%/}/api/v1/auth/providers" |
            jq -e '.google | type == "boolean"'
          for route in user refresh; do
            method=GET
            if [[ "$route" == refresh ]]; then method=POST; fi
            body=$(mktemp)
            status=$(curl --silent --show-error --max-time 20 --request "$method" \
              --output "$body" --write-out '%{http_code}' "${PRODUCTION_ORIGIN%/}/api/v1/$route")
            if [[ "$status" != 401 ]] || ! jq -e '.error | type == "string"' "$body" > /dev/null; then
              echo "Expected a JSON 401 from $method /api/v1/$route, got HTTP $status." >&2
              exit 1
            fi
          done
      - name: Summarize the release
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          STAGED_HOST: ${{ steps.deployment.outputs.host }}
          READY_RESULT: ${{ steps.deployment.outcome }}
          MIGRATION_RESULT: ${{ steps.migrations.outcome }}
          PROMOTION_RESULT: ${{ steps.promotion.outcome }}
          VERIFY_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            echo '## Vercel release'
            if [[ -n "$STAGED_HOST" ]]; then
              printf '\nStaged deployment: https://%s\n' "$STAGED_HOST"
            fi
            printf '\n| Step | Result |\n| --- | --- |\n'
            printf '| Build and stage | %s |\n' "${BUILD_RESULT:-skipped}"
            printf '| Confirm deployment is ready | %s |\n' "${READY_RESULT:-skipped}"
            printf '| Apply migrations | %s |\n' "${MIGRATION_RESULT:-skipped}"
            printf '| Promote to production | %s |\n' "${PROMOTION_RESULT:-skipped}"
            printf '| Verify the public site | %s |\n' "${VERIFY_RESULT:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
