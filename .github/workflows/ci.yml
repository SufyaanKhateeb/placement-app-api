name: API CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: placement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d placement_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/placement_test?sslmode=disable
      PLACEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/placement_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/migrate up
      - run: go test ./...
